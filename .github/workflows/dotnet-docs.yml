name: Build Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'Scripts/BuildDocumentationWebSite.ps1'
      - 'Scripts/BuildSamplesWebsite.ps1'
      - 'Scripts/AddFrozenV4Website.ps1'
      - '.github/pages-v4-snapshot.*'
      - '.github/workflows/dotnet-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'Scripts/BuildDocumentationWebSite.ps1'
      - 'Scripts/BuildSamplesWebsite.ps1'
      - 'Scripts/AddFrozenV4Website.ps1'
      - '.github/pages-v4-snapshot.*'
      - '.github/workflows/dotnet-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mapsui-pages
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
        
#Begin install mkdocs        
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
    - uses: actions/cache@v4
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: .cache
        restore-keys: |
          mkdocs-material-
    - run: |
        pip install mkdocs-material 
        pip install mkdocs-glightbox
#End install mkdocs        

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0         
        filter: tree:0 
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v5
      with:
         dotnet-version: |
           9.0.305
           8.0.x
    - name: install workloads
      run: dotnet workload install maui macos android ios maccatalyst wasm-tools wasm-tools-net8 
    - name: Run DocFx
      shell: pwsh
      run: ./Scripts/BuildDocumentationWebSite.ps1
      # build blazor samples to website/samples/
    - name: Build Blazor Website Sample
      shell: pwsh
      run: ./Scripts/BuildSamplesWebsite.ps1
    - name: Download frozen v4 website
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $manifest = Get-Content './.github/pages-v4-snapshot.json' | ConvertFrom-Json
        $archivePath = Join-Path $env:RUNNER_TEMP $manifest.assetName
        gh release download $manifest.releaseTag `
          --repo $env:GITHUB_REPOSITORY `
          --pattern $manifest.assetName `
          --dir $env:RUNNER_TEMP
        if ($LASTEXITCODE -ne 0) {
          throw 'Could not download the frozen v4 website.'
        }
        ./Scripts/AddFrozenV4Website.ps1 `
          -ArchivePath $archivePath `
          -WebsitePath ./website `
          -ExpectedSha256 $manifest.sha256 `
          -ExpectedFileCount $manifest.fileCount
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./website

  deploy-website:
    if: github.event_name != 'pull_request'
    needs: build-website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages artifact
      id: deployment
      uses: actions/deploy-pages@v4
